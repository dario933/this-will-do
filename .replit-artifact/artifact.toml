kind = "mobile"
previewPath = "/mobile/"
title = "This Will Do — iPhone"
description = "A native offline pass-the-phone edition of This Will Do for iPhone, with safe-object party gameplay, saved games, private voting, per-player timers, and a fail-closed Apple Full Pack purchase interface."
version = "1.0.0"
id = "artifacts/this-will-do-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18911

[services.development]
run = "pnpm --filter @workspace/this-will-do-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/this-will-do-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/this-will-do-mobile", "run", "serve" ]

[services.env]
PORT = "18911"
BASE_PATH = "/mobile/"
